[package]
name = "mailbourne"
description = "A liveable mail server and library — single binary, Rust-native, with a built-in inspector for DNS, DKIM, and deliverability."
keywords = ["mail", "smtp", "email", "server", "self-hosted"]
categories = ["email", "network-programming"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "mailbourne"
path = "src/main.rs"
required-features = ["cli"]

# Compose your mailbourne. Embed just what you need:
#   mailbourne = { version = "0.0.4", default-features = false, features = ["server"] }
# The core vocabulary, DKIM key management, and the built-in inspector are
# always present; these features add the moving parts.
[features]
default = ["cli"]
# The outbound engine: DKIM-sign, MX-route, TLS-dial, deliver.
send = [
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:mail-auth",
    "dep:rustls-pki-types",
]
# The receiving server: accept, spool durably, deliver to targets (a real
# server also sends — bounces, forwarding — so this implies `send`).
server = ["send", "dep:argon2"]
# The operator binary + interactive console (everything on).
cli = ["server", "dep:clap", "dep:dialoguer", "tokio/rt-multi-thread"]

[dependencies]
# Always present: the shared vocabulary (core), DKIM key management, and the
# built-in inspector (probe + judge). Pure Rust, static-musl friendly.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hickory-resolver = "0.24"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
base64 = "0.22"
# Async runtime — the union of what the enabled modules need.
tokio = { version = "1", features = ["io-util", "net", "time", "rt", "sync", "fs", "macros"] }
# TLS & mail auth — ring backend, vendored & static-musl friendly (`send`).
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"], optional = true }
webpki-roots = { version = "0.26", optional = true }
mail-auth = { version = "0.11", default-features = false, features = ["ring", "report", "dns-hickory"], optional = true }
rustls-pki-types = { version = "1", optional = true }
# Account password hashing (`server`).
argon2 = { version = "0.5", optional = true }
# The operator binary + interactive console (`cli`).
clap = { version = "4", features = ["derive"], optional = true }
dialoguer = { version = "0.11", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "time", "fs", "rt-multi-thread", "macros"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
